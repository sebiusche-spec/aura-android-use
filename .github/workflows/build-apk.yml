name: Build APK
on:
  push:
    branches: [ main, kairox-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check google-services.json exists
        run: |
          if [ ! -f aura-android/app/google-services.json ]; then
            echo "ERROR: google-services.json missing! Upload real file from Firebase."
            exit 1
          fi
          echo "Real google-services.json found, using it."

      - name: Grant execute permission
        run: chmod +x ./aura-android/gradlew

      - name: Build Debug APK
        run: cd aura-android && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAIROX-APK
          path: aura-android/app/build/outputs/apk/debug/app-debug.apk
